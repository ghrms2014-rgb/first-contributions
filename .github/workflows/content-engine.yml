name: content-engine

# 매일 한국시간 아침 7시(UTC 22:00)에 뉴스를 모아 초안을 만들어 커밋한다.
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 수집 · 초안 · 사이트 빌드
        run: python3 content-engine/run.py

      - name: 변경사항 커밋
        run: |
          git config user.name "content-engine"
          git config user.email "actions@github.com"
          git add content-engine/data content-engine/drafts content-engine/site
          if git diff --staged --quiet; then
            echo "새로 추가된 내용이 없습니다."
          else
            git commit -m "chore(content): $(date -u +%Y-%m-%d) 초안 자동 생성"
            git push
          fi
