name: content-engine

# 매일 시드니 아침에 뉴스를 모아 초안을 만들어 커밋한다.
# GitHub Actions의 cron은 UTC 고정이라 서머타임을 따라가지 않는다.
# UTC 20:00 = 시드니 06:00 (AEST, 4~10월) / 07:00 (AEDT, 10~4월).
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 수집 · 초안 · 사이트 빌드
        run: python3 content-engine/run.py

      - name: 변경사항 커밋
        run: |
          git config user.name "content-engine"
          git config user.email "actions@github.com"
          git add content-engine/data content-engine/drafts content-engine/site
          if git diff --staged --quiet; then
            echo "새로 추가된 내용이 없습니다."
          else
            git commit -m "chore(content): $(date -u +%Y-%m-%d) 초안 자동 생성"
            git push
          fi
